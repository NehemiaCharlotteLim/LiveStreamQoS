<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  html,body { margin:0; padding:0; background:transparent; color:inherit; font:14px Arial, sans-serif; }
  .status {padding:10px 12px; border:1px solid #93a3b550; border-radius:8px; color: #65758b;}
</style></head>
<body><div class="status" id="status">Menghubungkan agen WiFi di laptop...</div>
<script>
(() => {
  "use strict";
  const status = document.getElementById("status");
  let active = false;
  let interval = 5000;
  let timer = null;
  let inFlight = false;
  let lastSent = "";
  const send = (type, fields = {}) => window.parent.postMessage({isStreamlitMessage:true,type,...fields}, "*");
  const resize = () => send("streamlit:setFrameHeight", {height: 52});
  function updateStatus(s) { status.textContent = s; resize(); }
  function sendValue(value) {
    const payload = JSON.stringify(value);
    if (payload !== lastSent) {
      lastSent = payload;
      send("streamlit:setComponentValue", {value, dataType:"json"});
    }
  }
  async function poll() {
    if (!active || inFlight) return;
    inFlight = true;
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), 2800);
      let response;
      try {
        response = await fetch("http://127.0.0.1:8765/qos", {
          method:"GET", mode:"cors", cache:"no-store", signal:controller.signal,
          targetAddressSpace:"loopback"
        });
      } finally {clearTimeout(id);}
      if (!response.ok) throw new Error("Agen mengembalikan HTTP " + response.status);
      const payload = await response.json();
      if (!payload || !Array.isArray(payload.samples)) throw new Error("Format respons agen tidak benar");
      updateStatus("Agen WiFi terhubung · " + payload.samples.length + "/12 interval valid");
      sendValue({kind:"data",payload});
    } catch (err) {
      updateStatus("Belum dapat membaca agen WiFi pada laptop ini.");
      sendValue({kind:"error",message: String(err && err.message || err)});
    } finally {inFlight = false;}
  }
  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    const nextActive = !!args.running;
    interval = Math.max(1000, Number(args.polling_ms) || 5000);
    if (nextActive && !active) {
      active = true;
      poll();
      timer = setInterval(poll, interval);
    } else if (!nextActive && active) {
      active = false;
      if (timer) clearInterval(timer);
      timer = null;
    }
    resize();
  });
  send("streamlit:componentReady", {apiVersion:1});
  resize();
})();
</script></body></html>
