<!doctype html>
<html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
body {font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;color:#1f2937;background:transparent;font-size:14px}
.controls {display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button {font:inherit;cursor:pointer;padding:10px 16px;border-radius:8px;border:1px solid #a0a0a0;background:#ededed;color:#171717}
button.primary {background:#cf354f;border-color:#cf354f;color:white;font-weight:600}
button:disabled {opacity:.5;cursor:not-allowed}
#status {margin-top:8px;min-height:22px;font-size:13px}
.muted {color:#6b7280}
@media (prefers-color-scheme: dark) {body {color:#e5e7eb} .muted {color:#9ca3af}}
</style>
</head><body>
<div class="controls"><button class="primary" id="start">Mulai Monitoring</button><button id="stop" disabled>Hentikan Monitoring</button></div>
<div id="status" class="muted">Jalankan agen WiFi pada laptop terlebih dahulu, kemudian klik Mulai Monitoring.</div>
<script>
(function(){
 const url='http://127.0.0.1:8765';
 const start=document.getElementById('start'), stop=document.getElementById('stop'), status=document.getElementById('status');
 let timer=null, active=false, lastRevision='';
 function msg(type, extra){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra||{}),'*')}
 msg('streamlit:componentReady',{apiVersion:1}); msg('streamlit:setFrameHeight',{height:102});
 function render(data){
    active=!!data.active; start.disabled=active; stop.disabled=!active;
    const count=(data.rows||[]).length;
    status.textContent=(active?'Monitoring WiFi aktif':'Monitoring tidak aktif')+' | Sampel: '+count+' | Adaptor: '+(data.interface||'belum terhubung')+(data.last_error?' | '+data.last_error:'');
    status.className=active?'':'muted';
    const rev=JSON.stringify([data.session_id,data.active,data.rows?.length,data.rows?.at(-1)?.interval_end,data.last_error]);
    if(rev!==lastRevision){lastRevision=rev; msg('streamlit:setComponentValue',{value:data,dataType:'json'});}
 }
 async function request(path, method='GET'){
   const response=await fetch(url+path,{method,mode:'cors',cache:'no-store'});
   const data=await response.json();
   if(!response.ok||data.ok===false)throw new Error(data.message||data.error||'Gagal menghubungkan agen lokal');
   return data;
 }
 async function poll(){try {render(await request('/status'));}catch(e){
    if(active){active=false;start.disabled=false;stop.disabled=true;}
    status.textContent='Tidak terhubung ke agen WiFi laptop. Pastikan agen aktif dan izin akses jaringan lokal browser diizinkan. '+e.message;
    status.className='muted';
 }}
 start.onclick=async function(){
   start.disabled=true;status.textContent='Menghubungkan pengukuran WiFi lokal...';
   try{ const data=await request('/start','POST');render(data); if(!timer)timer=setInterval(poll,2000); }
   catch(e){start.disabled=false;status.textContent='Gagal terhubung. Buka start_wifi.bat di laptop lalu izinkan akses jaringan lokal untuk website ini. '+e.message;}
 };
 stop.onclick=async function(){
  stop.disabled=true; try{render(await request('/stop','POST'));}catch(e){status.textContent=e.message;}
 };
 // Permission jaringan lokal diminta hanya setelah pengguna menekan tombol Mulai Monitoring.
 window.addEventListener('message',(ev)=>{if(ev.data?.type==='streamlit:render')msg('streamlit:setFrameHeight',{height:102});});
})();
</script></body></html>
